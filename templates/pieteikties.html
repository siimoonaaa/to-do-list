{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 5px solid #2E5984;">
    <h2 style="text-align: center; color: #2E5984;">Pieteikties</h2>
    <form action="/pieteikties" method="POST">
        <label>Lietotājvārds</label>
        <input type="text" name="lietotajs" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #D5DBDB; border-radius: 5px;">
        <label>Parole</label>
        <input type="password" name="parole" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #D5DBDB; border-radius: 5px;">
        <button type="submit" style="width: 100%; background: #2E5984; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; margin-top: 10px;">Ieiet</button>
    </form>
</div>
{% endblock %}
