<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { background-color: #FDF5E6; color: #2C3E50; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        nav { background-color: #2E5984; padding: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; transition: 0.3s; }
        nav a:hover { color: #D4E6F1; }
        .footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #7F8C8D; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Sākums</a>
        <a href="/kalendars">Mans Kalendārs</a>
        {% if session.get('id') %}
            <a href="/atslogoties" style="color: #F1948A;">Iziet</a>
        {% else %}
            <a href="/pieteikties">Pieteikties</a>
            <a href="/registreties">Reģistrēties</a>
        {% endif %}
    </nav>

    {% block content %}{% endblock %}

    <div class="footer">© 2026 To-Do List Projekts</div>
</body>
</html>
